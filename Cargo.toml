[package]
name = "headset-tui"
version = "0.1.5"
edition = "2021"
description = "HeadsetControl integration for Waybar with an interactive TUI"
license = "GPL-3.0-or-later"
repository = "https://github.com/Henriklmao/headset-tui"

[[bin]]
name = "headset-tui"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.3"
ratatui = "0.30.2"
crossterm = "0.29"
dirs = "7.0.0"

[dev-dependencies]
tempfile = "3.27.0"
